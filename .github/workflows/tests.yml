# Runs the unit test suite on a clean machine for every push and pull request.
#
# The suite makes no network calls and constructs no OpenAI client, so no API key
# or repository secret is required. Dependencies are installed from
# requirements-dev.txt, which pulls in requirements.txt — so a green run also
# proves the documented install path works from scratch, not just the tests.

name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:        # lets the suite be run by hand from the Actions tab

permissions:
  contents: read            # least privilege: the workflow only reads the code

concurrency:
  # A newer push supersedes an in-progress run on the same branch.
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15     # a hung dependency install fails fast, not after hours

    strategy:
      fail-fast: false      # report every version, not just the first failure
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run tests
        # The module form puts the repository root on sys.path, which is what
        # lets `import rag_engine` resolve without packaging the project.
        run: python -m pytest -q
